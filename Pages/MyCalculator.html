<style>
  .container {
    width: 100%;
    max-width: 360px;
  }

  .calculator {
    background: #ffffff;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }

  /* DISPLAY */
  .Calcdisplay {
    width: 90%;
    height: 65px;
    font-size: 28px;
    text-align: right;
    padding: 12px 16px;
    border: none;
    outline: none;
    border-radius: 12px;
    background: #f3f4f6;
    margin-bottom: 18px;
    box-sizing: border-box;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .buttons button {
    height: 58px;
    font-size: 18px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: #e5e7eb;
    transition: 0.2s;
  }

  .buttons button:hover {
    background: #d1d5db;
  }

  .buttons button:active {
    transform: scale(0.94);
  }

  .operator {
    background: #6366f1;
    color: white;
  }

  .operator:hover {
    background: #4f46e5;
  }

  .equal {
    background: #22c55e;
    color: white;
    grid-column: span 2;
  }

  .equal:hover {
    background: #16a34a;
  }

  .clear {
    background: #ef4444;
    color: white;
  }

  .clear:hover {
    background: #dc2626;
  }

  @media (max-width: 480px) {
    .Calcdisplay {
      height: 55px;
      font-size: 22px;
    }
  }
</style>

<div class="container">
  <div class="calculator">
    <input type="text" class="Calcdisplay" ng-model="display" readonly />

    <div class="buttons">
      <button class="clear" ng-click="clear()">C</button>
      <button ng-click="del()">DEL</button>
      <button class="operator" ng-click="op('%')">%</button>
      <button class="operator" ng-click="op('/')">/</button>

      <button ng-click="num(7)">7</button>
      <button ng-click="num(8)">8</button>
      <button ng-click="num(9)">9</button>
      <button class="operator" ng-click="op('*')">*</button>

      <button ng-click="num(4)">4</button>
      <button ng-click="num(5)">5</button>
      <button ng-click="num(6)">6</button>
      <button class="operator" ng-click="op('-')">-</button>

      <button ng-click="num(1)">1</button>
      <button ng-click="num(2)">2</button>
      <button ng-click="num(3)">3</button>
      <button class="operator" ng-click="op('+')">+</button>

      <button ng-click="num(0)">0</button>
      <button ng-click="num('.')">.</button>
      <button class="equal" ng-click="calc()">=</button>
    </div>
  </div>
</div>
